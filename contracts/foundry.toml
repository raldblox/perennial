[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
# Pinned so a rebuild matches the deployed bytecode (docs/deployments.md).
evm_version = "prague"
optimizer = true
optimizer_runs = 200
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "qorechain-asset-kit/=lib/qorechain-asset-kit/contracts/src/",
]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = false

[fmt]
line_length = 100

# Public QoreChain EVM endpoints. Use them by name:
#   forge script ... --rpc-url qorechain_testnet
[rpc_endpoints]
qorechain_testnet = "https://evm-testnet.qore.host"
